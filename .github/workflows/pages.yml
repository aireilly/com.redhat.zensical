name: Publish documentation

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install DITA-OT 4.3.4
        run: |
          curl --fail --location --silent --show-error \
            https://github.com/dita-ot/dita-ot/releases/download/4.3.4/dita-ot-4.3.4.zip \
            --output "$RUNNER_TEMP/dita-ot.zip"
          unzip -q "$RUNNER_TEMP/dita-ot.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/dita-ot-4.3.4/bin" >> "$GITHUB_PATH"

      - name: Install Zensical
        run: python -m pip install zensical==0.0.69

      - name: Install the DITA-OT plug-in
        run: |
          zip -qr com.redhat.zensical.zip \
            plugin.xml build_zensical.xml conductor.xml \
            xsl python resources docs
          dita install com.redhat.zensical.zip

      - name: Build the documentation site
        run: >-
          dita -i docs/guide.ditamap -f zensical -o out
          -Dzensical.config=docs/zensical.toml

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: out/site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
